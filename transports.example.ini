[backend:max]
component_domain = max.example.com
component_host = 127.0.0.1
component_port = 5237
component_connect_timeout = 20
component_secret = replace-with-max-component-secret
control_localpart = bot
server_domain = example.com
http_host = 127.0.0.1
http_port = 8089
contacts_page_size = 20
roster_group = MAX
test_self_messages = false

[backend:telegram]
component_domain = telegram.example.com
component_host = 127.0.0.1
component_port = 5238
component_connect_timeout = 20
component_secret = replace-with-telegram-component-secret
control_localpart = bot
server_domain = example.com
http_host = 127.0.0.1
http_port = 8088
api_id = 123456
api_hash = replace-with-telegram-api-hash
media_url_secret = replace-with-at-least-32-random-characters
media_stream_request_size = 524288
contacts_page_size = 20
media_base_url = https://telegram.example.com
avatar_base_url = https://telegram.example.com
avatar_storage_dir = data/avatars/telegram
avatar_max_bytes = 524288
avatar_unreferenced_ttl_days = 7
avatar_cleanup_interval_seconds = 86400
roster_group = Telegram
test_self_messages = false

[database]
dsn = postgresql://transport:change-me@127.0.0.1:5432/xabber_transport
min_pool_size = 1
max_pool_size = 5
command_timeout = 30

[security]
credential_key = replace-with-a-fernet-key
iq_auth_secret = replace-with-shared-roster-iq-secret
