[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xabber-xmpp-transport"
version = "0.1.0"
description = "Provider-neutral XMPP transport framework"
requires-python = ">=3.9"
dependencies = [
  "aiohttp>=3.8,<4",
  "asyncpg>=0.27,<1",
  "cryptography>=41,<47",
  "qrcode>=7.4,<9",
  "slixmpp>=1.8,<1.11",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=7.4",
  "ruff>=0.3",
]

[project.scripts]
xabber-transport = "xmpp_transport.runtime.app:main"

[tool.setuptools.packages.find]
include = ["xmpp_transport*"]

[tool.setuptools.package-data]
"xmpp_transport.adapters.postgres" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["xmpp_transport"]
